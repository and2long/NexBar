name: Release DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0). Defaults to MARKETING_VERSION in project.'
        required: false
        default: ''
      publish_release:
        description: 'Create or update a GitHub Release when triggered manually'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: xcode-27
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show toolchain info
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Resolve version and tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            SHOULD_RELEASE="true"
          else
            INPUT_VER="${{ inputs.version }}"
            if [[ -n "$INPUT_VER" ]]; then
              VERSION="${INPUT_VER#v}"
            else
              VERSION="$(sed -n 's/.*"MARKETING_VERSION"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' NexBar.xcodeproj/project.xcproj | head -n 1)"
              VERSION="${VERSION:-1.0.0}"
            fi
            TAG="v${VERSION}"
            SHOULD_RELEASE="${{ inputs.publish_release }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"

      - name: Run core unit tests
        run: |
          swiftc -parse-as-library -target arm64-apple-macosx14.0 \
            NexBar/Models/SystemMetrics.swift \
            NexBar/Models/CleanupModels.swift \
            NexBar/Services/ByteRateFormatter.swift \
            NexBar/Services/CPUSampler.swift \
            NexBar/Services/NetworkSampler.swift \
            NexBar/Services/DiskCleanerEngine.swift \
            Tests/NexBarCoreTests.swift \
            -o /tmp/NexBarCoreTests
          /tmp/NexBarCoreTests
          rm -f /tmp/NexBarCoreTests

      - name: Build and package DMG
        run: |
          chmod +x scripts/package-dmg.sh
          ./scripts/package-dmg.sh --version "${{ steps.meta.outputs.version }}"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexBar-${{ steps.meta.outputs.version }}-arm64-dmg
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.meta.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: NexBar ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.sha256
