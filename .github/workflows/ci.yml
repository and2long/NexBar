name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: xcode-27
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show toolchain info
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Run core unit tests
        run: |
          swiftc -parse-as-library -target arm64-apple-macosx14.0 \
            NexBar/Models/SystemMetrics.swift \
            NexBar/Models/CleanupModels.swift \
            NexBar/Services/ByteRateFormatter.swift \
            NexBar/Services/CPUSampler.swift \
            NexBar/Services/NetworkSampler.swift \
            NexBar/Services/DiskCleanerEngine.swift \
            Tests/NexBarCoreTests.swift \
            -o /tmp/NexBarCoreTests
          /tmp/NexBarCoreTests
          rm -f /tmp/NexBarCoreTests

      - name: Build NexBar (Release)
        run: |
          xcodebuild \
            -project NexBar.xcodeproj \
            -scheme NexBar \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build
